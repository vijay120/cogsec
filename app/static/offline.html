<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · CogSec Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="gate">
    <div class="gate-card">
      <div class="gate-brand">🧠 CogSec <span>Tracker</span></div>
      <h1>You're offline</h1>
      <p class="lede">
        Pages you've already opened are still readable from the cache, but saving
        needs a connection — entries are written straight to the server.
      </p>
      <p><button type="button" class="gate-submit" onclick="location.reload()">Try again</button></p>
    </div>
  </main>
</body>
</html>
