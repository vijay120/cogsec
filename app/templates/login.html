<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1719">
  <meta name="robots" content="noindex, nofollow">
  <title>Unlock · CogSec Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('apple_touch_icon') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CogSec">
</head>
<body>
  <main class="gate">
    <form class="gate-card" method="post" autocomplete="on">
      <div class="gate-brand">🧠 CogSec <span>Tracker</span></div>
      <label class="block" for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" inputmode="text"
             autocomplete="current-password" autofocus required>
      {% if error %}<p class="gate-error">{{ error }}</p>{% endif %}
      <button type="submit" class="gate-submit">Unlock</button>
    </form>
  </main>
</body>
</html>
